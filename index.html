<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AETHER — Игровая Студия</title>
</head>
<body>
  <canvas id="bg-canvas" class="bg-canvas"></canvas>
  <div id="header"></div>

  <main>
    <section class="hero">
      <div class="hero__content">
        <div class="hero__badge">Независимая студия • С 2023</div>
        
        <h1 class="hero__title">
          Мы создаём миры,<br>
          в которые хочется вернуться
        </h1>
        
        <p class="hero__subtitle">
          AETHER — небольшая команда, которая делает атмосферные, 
          честные и визуально впечатляющие игры.
        </p>

        <div class="hero__actions">
          <a href="./games.html" class="btn btn--primary">Исследовать игры</a>
          <a href="#" class="btn btn--secondary">Смотреть трейлер</a>
        </div>

        <div class="hero__stats">
          <div class="stat">
            <span class="stat__number">12</span>
            <span class="stat__label">Выпущенных игр</span>
          </div>
          <div class="stat">
            <span class="stat__number">4.8M</span>
            <span class="stat__label">Игроков по всему миру</span>
          </div>
          <div class="stat">
            <span class="stat__number">19</span>
            <span class="stat__label">Наград и номинаций</span>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
